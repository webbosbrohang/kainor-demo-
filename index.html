<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KAINOR Coffee & Food</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                yellow: '#FCD34D', // Matching the yellow in screenshots
                dark: '#1F2937',
              }
            },
            animation: {
              'fade-slide': 'fadeSlideUp 0.4s ease-out forwards',
              'scale-pulse': 'scalePulse 0.3s ease-out forwards',
            },
            keyframes: {
              fadeSlideUp: {
                '0%': { opacity: '0', transform: 'translateY(10px) scale(0.98)' },
                '100%': { opacity: '1', transform: 'translateY(0) scale(1)' },
              },
              scalePulse: {
                '0%': { transform: 'scale(1)' },
                '50%': { transform: 'scale(0.95)' },
                '100%': { transform: 'scale(1)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      /* Hide scrollbar for chrome/safari/opera */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      /* Hide scrollbar for IE, Edge and Firefox */
      .no-scrollbar {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
      }
      
      /* Smooth view transitions */
      .view-transition {
        animation: fadeSlideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      
      @keyframes fadeSlideUp {
        0% { opacity: 0; transform: translateY(15px); }
        100% { opacity: 1; transform: translateY(0); }
      }

      /* Coffee Loader Styles */
      .loader {
        width: 100px;
        height: 100px;
        position: relative;
        /* Animation on the container itself was causing full rotation in provided snippet, keeping it container-static */
      }

      .cup {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: 40px;
        height: 30px;
        background-color: #5b4022cb;
        border: 1px solid #2e2e2e;
        border-radius: 3px 3px 10px 10px;
        z-index: 1;
        animation: cupPulse 6s infinite ease-in-out;
      }

      .cup::before {
        content: "";
        position: absolute;
        bottom: -5px;
        width: calc(100% - 2px);
        height: 6px;
        background: #5b4022cb;
        border: 1px solid #2e2e2e;
        border-top: none;
        border-radius: 50%;
        z-index: -1;
        animation: cupPulse 6s infinite ease-in-out;
      }

      .cup::after {
        content: "";
        position: absolute;
        top: -2px;
        left: 1px;
        width: calc(100% - 2px);
        height: 4px;
        background: #da8920ca;
        border: 1px solid #2e2e2e;
        border-radius: 50%;
        animation: coffeeGlow 6s infinite ease-in-out;
      }

      .cup-handle {
        position: absolute;
        top: 5px;
        right: -10px;
        width: 10px;
        height: 15px;
        border: 2px solid #2e2e2e;
        border-left: none;
        border-radius: 0 10px 10px 0;
        background: transparent;
      }

      .smoke {
        position: absolute;
        bottom: 100%;
        left: 50%;
        width: 10px;
        height: 25px;
        background: rgba(72, 67, 67, 0.501);
        border-radius: 50%;
        transform: translateX(-50%);
        animation: rise 3s infinite ease-in-out;
        filter: blur(8px);
      }

      .smoke.one {
        animation-delay: 0s;
      }
      .smoke.two {
        animation-delay: 0.8s;
      }
      .smoke.three {
        animation-delay: 1.6s;
      }

      .load {
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        font-size: 12px;
        color: #2e2e2e;
        opacity: 0.6;
        white-space: nowrap;
        font-family: ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
        font-weight: 600;
      }

      @keyframes rise {
        0% {
          transform: translate(-50%, 0) scale(0.4);
          opacity: 0;
        }
        30% {
          opacity: 0.7;
        }
        60% {
          opacity: 0.4;
        }
        100% {
          transform: translate(-50%, -120px) scale(1);
          opacity: 0;
        }
      }

      @keyframes shake {
        0% {
          transform: translateX(0) translateY(0) rotate(0);
        }
        25% {
          transform: translateX(-4px) translateY(-2px) rotate(-2deg);
        }
        50% {
          transform: translateX(0) translateY(0) rotate(0);
        }
        75% {
          transform: translateX(4px) translateY(-2px) rotate(2deg);
        }
        100% {
          transform: translateX(0) translateY(0) rotate(0);
        }
      }

      /* New Animations */
      @keyframes cupPulse {
        0%,
        100% {
          background-color: #5b4022cb;
        }
        50% {
          background-color: #f5f5f5bd;
        }
      }

      @keyframes coffeeGlow {
        0%,
        100% {
          background: #da8920ca;
        }
        50% {
          background: #fed197d5;
        }
      }
    </style>

{
  "imports": {

}
</script>
